[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "archway-diagram-compiler"
version = "0.1.0"
description = "Deterministic AWS architecture diagram compiler for semantic specs."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pydantic>=1.10,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archway_diagram_compiler = ["assets/aws-icons/64/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
