[project]
name = "archway"
version = "0.1.0"
description = "AWS-focused AI solution architecture assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
  "boto3>=1.43"
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
