# Machine-readable source of truth for KNOWN failing tests (RC2).
#
# The validation harness (scripts/rc2_validate.py) reads THIS file to classify a
# failing test as FAIL_KNOWN instead of FAIL_NEW. docs/rc2/KNOWN_ISSUES.md remains
# the human narrative; this file is the machine contract.
#
# Rules:
# - A failing test listed here is reported as FAIL_KNOWN (a documented exception),
#   never silently treated as success. It downgrades the headline to
#   READY_WITH_KNOWN_ISSUES, not READY.
# - A failing test NOT listed here is FAIL_NEW and BLOCKS the report.
# - A listed test that now PASSES is reported as KNOWN_FAIL_NOW_PASSING so this
#   file can be cleaned up (stale metadata).
#
# Adding an entry here is auditable: every entry must reference an issue_id in
# KNOWN_ISSUES.md, a reason, and an added_date. Do not add entries to launder
# real regressions.

schema: rc2_known_failures_v1
