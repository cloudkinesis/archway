# (I1 fixed by fix/utility-grid-e2e-citation-determinism @ 6081c76; I2 fixed by
# fix/utility-metric-structuring @ 1138849). The harness reported them as
# KNOWN_FAIL_NOW_PASSING, which per the rules above means this file must be
# cleaned up. No known failing tests remain.
known_failures: []
